name: Deploy to GitHub Pages

# htdocs/ (2ペイン演習UI + out.wasm) を GitHub Pages へ公開する。
# COOP/COEP は coi-serviceworker (htdocs/coi-serviceworker.js) が擬似付与するため、
# Pages 側でヘッダ設定は不要。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: htdocs
      - id: deployment
        uses: actions/deploy-pages@v4
